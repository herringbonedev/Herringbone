name: Mongo Connection Tests

on:
  pull_request:
    paths:
      - "modules/**"
      - ".github/workflows/mongo-connection-tests.yml"

permissions:
  contents: read

jobs:
  mongo-connections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pymongo>=4,<5'
      - run: python -m unittest discover -s modules/tests -v
