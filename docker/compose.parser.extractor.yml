services:
  parser-extractor:
    image: quay.io/herringbone/parser-extractor:837fbfb4@sha256:9fe5f1899c2b04818cf0a8e14aee48b6c83a08900a39e436f3aeca1ce2b8a5c8
    restart: unless-stopped
    networks:
      - herringbone
    expose:
      - "7006"
    working_dir: /app-root
    environment:
      PYTHONPATH: /app-root:/python-packages:/modules
      HERRINGBONE_SERVICE: parser-extractor
      HERRINGBONE_UNIT: parser
      HERRINGBONE_ELEMENT: extractor
      AUDIT_EXTRACTOR_SUCCESS: "false"
      AUDIT_EXTRACTOR_ERRORS: "true"
      AUDIT_AUTH_SUCCESS: "false"
      AUDIT_SERVICE_TOKEN_SUCCESS: "false"
      AUDIT_TOKEN_SUCCESS: "false"
      EXTRACTOR_USE_ORJSON: "true"
      EXTRACTOR_GROUP_BATCH_BY_CARD: "true"
      EXTRACTOR_TIMING_HEADER: "true"
      EXTRACTOR_ACCESS_LOG: "false"
      EXTRACTOR_HEARTBEAT_ENABLED: "true"
      EXTRACTOR_HEARTBEAT_INTERVAL: "5.0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    secrets:
      - service_jwt_public_key

    deploy:
      replicas: ${PARSER_EXTRACTOR_REPLICAS:-3}

networks:
  herringbone:
    external: true
    name: herringbone_net

secrets:
  service_jwt_public_key:
    file: ./secrets/runtime/service_jwt_public_key