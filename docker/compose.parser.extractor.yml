services:
  parser-extractor:
    container_name: parser-extractor
    image: quay.io/herringbone/parser-extractor:97cd747e@sha256:9a5ae818dc24dfd45a6fa21c9ba795175bf17c9a5c94dbca287fe45199a1fb12
    restart: unless-stopped
    networks:
      - herringbone
    expose:
      - "7006"
    working_dir: /app-root
    environment:
      PYTHONPATH: /app-root:/python-packages:/modules
      # Context
      HERRINGBONE_SERVICE: parser-extractor
      HERRINGBONE_UNIT: parser
      HERRINGBONE_ELEMENT: extractor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - service_jwt_public_key
networks:
  herringbone:
    external: true
    name: herringbone_net
secrets:
  service_jwt_public_key:
    file: ./secrets/runtime/service_jwt_public_key
