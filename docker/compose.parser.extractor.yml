services:
  parser-extractor:
    container_name: parser-extractor
    image: quay.io/herringbone/parser-extractor:3b40cbd5@sha256:cdc9c3a3872b8289bd2b500b39e35d46b9b3db3eb5372a16848c8f918deaec73
    restart: unless-stopped
    networks:
      - herringbone
    expose:
      - "7006"
    working_dir: /app-root
    environment:
      PYTHONPATH: /app-root:/python-packages:/modules
      # Context
      HERRINGBONE_SERVICE: parser-extractor
      HERRINGBONE_UNIT: parser
      HERRINGBONE_ELEMENT: extractor
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - service_jwt_public_key
networks:
  herringbone:
    external: true
    name: herringbone_net
secrets:
  service_jwt_public_key:
    file: ./secrets/runtime/service_jwt_public_key
