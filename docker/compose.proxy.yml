services:
  herringbone-proxy:
    image: nginx:alpine
    restart: unless-stopped
    networks:
    - herringbone
    ports:
    - "8080:80"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: ${HERRINGBONE_PROXY_REPLICAS:-1}
networks:
  herringbone:
    name: herringbone_net
