services:
  incidents-correlator:
    image: quay.io/herringbone/incidents-correlator:b4a8a79c@sha256:35dbeb29ec7ca02c6b9ff3392383b2bd7b0160fcb0a3285bf7125d32f88a0b74
    restart: unless-stopped
    networks:
      - herringbone
    expose:
      - "7012"
    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      DB_NAME: ${DB_NAME}
      AUTH_DB: ${AUTH_DB}
      COLLECTION_NAME: incidents
      EVENTS_API_BASE: http://herringbone-logs:7010/herringbone/logs/events
      HERRINGBONE_SERVICE: incidents-correlator
      HERRINGBONE_UNIT: incidents
      HERRINGBONE_ELEMENT: correlator
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    secrets:
      - service_token
      - service_jwt_public_key
      - jwt_secret
    deploy:
      replicas: ${INCIDENTS_CORRELATOR_REPLICAS:-1}
secrets:
  service_token:
    file: ./secrets/runtime/incidents_correlator_service_token
  service_jwt_public_key:
    file: ./secrets/runtime/service_jwt_public_key
  jwt_secret:
    file: ./secrets/runtime/jwt_secret
networks:
  herringbone:
    external: true
    name: herringbone_net
