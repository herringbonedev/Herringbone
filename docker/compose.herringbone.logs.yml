services:
  herringbone-logs:
    image: quay.io/herringbone/herringbone-logs:c61eb2b6@sha256:ae33ca9b44bf637ad2e0a07968c186f49fef9900c03d741715cc0375a588055d
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - herringbone
    expose:
      - "7010"
    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      DB_NAME: ${DB_NAME}
      AUTH_DB: ${AUTH_DB}
      COLLECTION_NAME: events
      HERRINGBONE_SERVICE: herringbone-logs
      HERRINGBONE_UNIT: herringbone
      HERRINGBONE_ELEMENT: logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    secrets:
      - jwt_secret
    deploy:
      replicas: ${HERRINGBONE_LOGS_REPLICAS:-3}
networks:
  herringbone:
    external: true
    name: herringbone_net
secrets:
  jwt_secret:
    file: ./secrets/runtime/jwt_secret
