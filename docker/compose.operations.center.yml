services:
  operations-center:
    image: docker-herringbone-logs:latest
    restart: unless-stopped
    profiles:
    - ops
    environment:
      HERRINGBONE_SERVICE: operations-center
      HERRINGBONE_UNIT: operations-center
      HERRINGBONE_ELEMENT: ui
    networks:
    - herringbone
    expose:
    - "8080"
    read_only: true
    tmpfs:
    - /tmp
    - /var/lib/nginx/tmp
    - /run
    security_opt:
    - no-new-privileges:true
    deploy:
      replicas: ${OPERATIONS_CENTER_REPLICAS:-3}
networks:
  herringbone:
    external: true
    name: herringbone_net
