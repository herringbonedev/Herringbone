services:
  operations-center:
    image: quay.io/herringbone/operations-center:sha-fe638be4@sha256:5ddf25cd8f174d5be6eb77ee2e756e2d8f6438170716257022003fc149808a98
    container_name: operations-center
    restart: unless-stopped

    profiles: ["ops"]

    environment:
      # Context
      HERRINGBONE_SERVICE: operations-center
      HERRINGBONE_UNIT: operations-center
      HERRINGBONE_ELEMENT: ui

    networks:
      - herringbone

    expose:
      - "8080"

    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/nginx/tmp
      - /run
    security_opt:
      - no-new-privileges:true
