services:
  operations-center:
    image: quay.io/herringbone/operations-center:sha-cecc7ffc@sha256:56e2e6afe5ac0c37a2c3a345cd5a2f35a3008905cd945f73786d8c737aed7167
    container_name: operations-center
    restart: unless-stopped

    profiles: ["ops"]

    environment:
      # Context
      HERRINGBONE_SERVICE: operations-center
      HERRINGBONE_UNIT: operations-center
      HERRINGBONE_ELEMENT: ui

    networks:
      - herringbone

    expose:
      - "8080"

    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/nginx/tmp
      - /run
    security_opt:
      - no-new-privileges:true
