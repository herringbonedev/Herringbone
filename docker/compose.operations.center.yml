services:
  operations-center:
    image: quay.io/herringbone/operations-center:a3dfe877@sha256:5e91c703c8e1b13064303614029eaf3bcf69456965c5d56f518e2b71f679ab9d
    container_name: operations-center
    restart: unless-stopped

    profiles: ["ops"]

    environment:
      # Context
      HERRINGBONE_SERVICE: operations-center
      HERRINGBONE_UNIT: operations-center
      HERRINGBONE_ELEMENT: ui

    networks:
      - herringbone

    expose:
      - "8080"

    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/nginx/tmp
      - /run
    security_opt:
      - no-new-privileges:true
