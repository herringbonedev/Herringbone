services:
  operations-center:
    image: quay.io/herringbone/operations-center:sha-75579238@sha256:00e12c006d054fa86f017bc5544999ef766f4f7eb1c8ee1a60dcf7887ee9cede
    container_name: operations-center
    restart: unless-stopped

    profiles: ["ops"]

    environment:
      # Context
      HERRINGBONE_SERVICE: operations-center
      HERRINGBONE_UNIT: operations-center
      HERRINGBONE_ELEMENT: ui

    networks:
      - herringbone

    expose:
      - "8080"

    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/nginx/tmp
      - /run
    security_opt:
      - no-new-privileges:true
