services:
  herringbone-auth:
    image: quay.io/herringbone/herringbone-auth:c0529cf5@sha256:14eb3c67c97c422dee44f7d33d8481b90e197def913b4c382be4912d51af9bed
    user: 65532:65532
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - herringbone
    expose:
      - "7001"
    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      DB_NAME: ${DB_NAME}
      AUTH_DB: ${AUTH_DB}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SERVICE_JWT_PRIVATE_KEY_FILE: /run/secrets/service_jwt_private_key
      SERVICE_JWT_PUBLIC_KEY_FILE: /run/secrets/service_jwt_public_key
      BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      HERRINGBONE_SERVICE: herringbone-auth
      HERRINGBONE_UNIT: herringbone
      HERRINGBONE_ELEMENT: auth
    secrets:
      - jwt_secret
      - service_jwt_private_key
      - service_jwt_public_key
      - bootstrap_token
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: ${HERRINGBONE_AUTH_REPLICAS:-3}
secrets:
  jwt_secret:
    file: ./secrets/runtime/jwt_secret
  service_jwt_private_key:
    file: ./secrets/runtime/service_jwt_private_key
  service_jwt_public_key:
    file: ./secrets/runtime/service_jwt_public_key
  bootstrap_token:
    file: ./secrets/runtime/bootstrap_token
