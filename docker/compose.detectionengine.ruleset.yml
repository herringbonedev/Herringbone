services:
  detectionengine-ruleset:
    image: quay.io/herringbone/detectionengine-ruleset:b4a8a79c@sha256:289ac5874e09308eefda75c250da1631197395961f6479108b6661dba98df29e
    restart: unless-stopped
    networks:
      - herringbone
    expose:
      - "7002"
    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      DB_NAME: ${DB_NAME}
      AUTH_DB: ${AUTH_DB}
      COLLECTION_NAME: rules
      HERRINGBONE_SERVICE: detectionengine-ruleset
      HERRINGBONE_UNIT: detectionengine
      HERRINGBONE_ELEMENT: ruleset
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    secrets:
      - service_token
      - service_jwt_public_key
      - jwt_secret
    deploy:
      replicas: ${DETECTIONENGINE_RULESET_REPLICAS:-3}
secrets:
  service_token:
    file: ./secrets/runtime/detectionengine_ruleset_service_token
  service_jwt_public_key:
    file: ./secrets/runtime/service_jwt_public_key
  jwt_secret:
    file: ./secrets/runtime/jwt_secret
networks:
  herringbone:
    external: true
    name: herringbone_net
