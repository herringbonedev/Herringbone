services:
  parser-cardset:
    image: quay.io/herringbone/parser-cardset:db08c080@sha256:ae5378c466da19f38a2498aee5879ce702951d6d840ffcf1ac79a32d8547593d
    restart: unless-stopped
    networks:
      - herringbone
    expose:
      - "7005"
    working_dir: /app-root
    environment:
      PYTHONPATH: /app-root:/python-packages:/modules
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
      DB_NAME: ${DB_NAME}
      AUTH_DB: ${AUTH_DB}
      COLLECTION_NAME: parse_cards
      HERRINGBONE_SERVICE: parser-cardset
      HERRINGBONE_UNIT: parser
      HERRINGBONE_ELEMENT: cardset
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    secrets:
      - service_token
      - service_jwt_public_key
      - jwt_secret
    depends_on:
      - mongodb
    deploy:
      replicas: ${PARSER_CARDSET_REPLICAS:-3}
secrets:
  service_token:
    file: ./secrets/runtime/parser_cardset_service_token
  service_jwt_public_key:
    file: ./secrets/runtime/service_jwt_public_key
  jwt_secret:
    file: ./secrets/runtime/jwt_secret
networks:
  herringbone:
    external: true
    name: herringbone_net
