services:
  logingestion-receiver:
    image: quay.io/herringbone/receiver:1fecd5a4@sha256:cd7a45e464808dc5951263f09f654a8ff2450456d7aa6104a82754a1dd30aa4f
    restart: unless-stopped
    networks:
      - herringbone
    ports:
      - "${HOST_PORT:-7004}:${CONTAINER_PORT:-7004}"
      - "${HOST_PORT:-7004}:${CONTAINER_PORT:-7004}/udp"
    environment:
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASS: ${MONGO_PASS}
      DB_NAME: ${DB_NAME:-herringbone}
      AUTH_DB: ${AUTH_DB:-admin}
      COLLECTION_NAME: ${COLLECTION_NAME:-events}
      EVENTS_COLLECTION: ${EVENTS_COLLECTION:-events}
      EVENT_STATE_COLLECTION: ${EVENT_STATE_COLLECTION:-event_state}
      RECEIVER_TYPE: ${RECEIVER_TYPE:-UDP}
      RECEIVER_MODE: ${RECEIVER_MODE:-local}
      PORT: ${CONTAINER_PORT:-7004}
      CONTEXT_ID: ${CONTEXT_ID:-default}
      HB_ENTERPRISE: ${HB_ENTERPRISE:-false}
      INGESTION_KEY: ${INGESTION_KEY:-}
      FORWARD_ROUTE: ${FORWARD_ROUTE:-}
      RECEIVER_QUEUE: ${RECEIVER_QUEUE:-250000}
      RECEIVER_WORKERS: ${RECEIVER_WORKERS:-8}
      RECEIVER_BATCH_SIZE: ${RECEIVER_BATCH_SIZE:-1000}
      RECEIVER_BATCH_FLUSH_MS: ${RECEIVER_BATCH_FLUSH_MS:-100}
      BATCH_DIRECT_MONGO: ${BATCH_DIRECT_MONGO:-true}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-200}
      MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-5000}
      MONGO_RETRY_WRITES: ${MONGO_RETRY_WRITES:-true}
      UDP_BUFFER: ${UDP_BUFFER:-65535}
      UDP_SOCKET_RCVBUF: ${UDP_SOCKET_RCVBUF:-33554432}
      RECEIVER_HEARTBEAT_ENABLED: ${RECEIVER_HEARTBEAT_ENABLED:-true}
      RECEIVER_HEARTBEAT_INTERVAL: ${RECEIVER_HEARTBEAT_INTERVAL:-5}
      RECEIVER_DROP_LOG_INTERVAL: ${RECEIVER_DROP_LOG_INTERVAL:-5}
      FORWARD_BATCH_SIZE: ${FORWARD_BATCH_SIZE:-1000}
      FORWARD_BATCH_FLUSH_MS: ${FORWARD_BATCH_FLUSH_MS:-100}
      FORWARD_WORKERS: ${FORWARD_WORKERS:-8}
      FORWARD_QUEUE: ${FORWARD_QUEUE:-250000}
      FORWARD_TIMEOUT: ${FORWARD_TIMEOUT:-5}
      FORWARD_HEARTBEAT_ENABLED: ${FORWARD_HEARTBEAT_ENABLED:-true}
      FORWARD_HEARTBEAT_INTERVAL: ${FORWARD_HEARTBEAT_INTERVAL:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: ${LOGINGESTION_RECEIVER_REPLICAS:-1}
networks:
  herringbone:
    external: true
    name: herringbone_net
