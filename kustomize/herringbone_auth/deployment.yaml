apiVersion: apps/v1
kind: Deployment
metadata:
  name: herringbone-auth
  namespace: herringbone
spec:
  replicas: 3
  selector:
    matchLabels:
      app: herringbone-auth
  template:
    metadata:
      labels:
        app: herringbone-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: herringbone-auth
          image: quay.io/herringbone/herringbone-auth
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7001
              protocol: TCP
          env:
            - name: MONGO_HOST
              value: "mongodb-headless.mongodb.svc.cluster.local"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: password
            - name: DB_NAME
              value: "herringbone"
            - name: AUTH_DB
              value: "herringbone"
            - name: JWT_SECRET_FILE
              value: "/run/secrets/jwt_secret"
            - name: SERVICE_JWT_PRIVATE_KEY_FILE
              value: "/run/secrets/service_jwt_private_key"
            - name: SERVICE_JWT_PUBLIC_KEY_FILE
              value: "/run/secrets/service_jwt_public_key"
            - name: BOOTSTRAP_TOKEN_FILE
              value: "/run/secrets/bootstrap_token"
            - name: HERRINGBONE_SERVICE
              value: "herringbone-auth"
            - name: HERRINGBONE_UNIT
              value: "herringbone"
            - name: HERRINGBONE_ELEMENT
              value: "auth"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-secrets
          secret:
            secretName: herringbone-auth-secrets
            items:
              - key: jwt_secret
                path: jwt_secret
              - key: service_jwt_private_key
                path: service_jwt_private_key
              - key: service_jwt_public_key
                path: service_jwt_public_key
              - key: bootstrap_token
                path: bootstrap_token
        - name: tmp
          emptyDir: {}
