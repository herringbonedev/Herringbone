apiVersion: apps/v1
kind: Deployment
metadata:
  name: herringbone-search
  namespace: herringbone
spec:
  replicas: 3
  selector:
    matchLabels:
      app: herringbone-search
  template:
    metadata:
      labels:
        app: herringbone-search
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: herringbone-search
          image: quay.io/herringbone/herringbone-search
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7014
              protocol: TCP
          env:
            - name: MONGO_HOST
              value: "mongodb-headless.mongodb.svc.cluster.local"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: username
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: password
            - name: DB_NAME
              value: "herringbone"
            - name: AUTH_DB
              value: "herringbone"
            - name: HERRINGBONE_SERVICE
              value: "herringbone-search"
            - name: HERRINGBONE_UNIT
              value: "herringbone"
            - name: HERRINGBONE_ELEMENT
              value: "search"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /herringbone/search/livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /herringbone/search/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-secrets
          secret:
            secretName: herringbone-auth-secrets
            items:
              - key: jwt_secret
                path: jwt_secret
        - name: tmp
          emptyDir: {}
